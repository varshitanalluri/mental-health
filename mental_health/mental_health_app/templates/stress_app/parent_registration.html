<!-- stress_app/templates/stress_app/parent_register.html -->
{% extends 'stress_app/base.html' %}
{% block content %}
<h3>Parent Registration</h3>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Register</button>
</form>
<p class="mt-3">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
{% endblock %}
